<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEP-Net Train Ego-Path Detection</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --border: #d9dde2;
      --accent: #4CAF50;
      --accent-dark: #3d8b40;
      --danger: #f44336;
      --text: #1f2933;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      /* Full-height app shell: header + a flex row that fills the viewport. */
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #263238;
      color: #fff;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .status { margin-left: auto; font-size: 13px; font-weight: 400; opacity: 0.85; }
    .layout {
      display: flex; gap: 12px; padding: 12px; align-items: stretch;
      flex: 1; min-height: 0; overflow: hidden;
    }
    /* Two-column control grid so all sections fit without scrolling. */
    .sidebar {
      width: 420px; flex-shrink: 0; overflow-y: auto;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; align-content: start;
    }
    .sidebar > .span2 { grid-column: 1 / -1; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; gap: 10px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 0;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
    .card h2 {
      margin: 0 0 7px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    label { display: block; font-size: 13px; margin-bottom: 4px; }
    select, input[type="number"], input[type="file"] {
      width: 100%;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .model-list { max-height: none; }
    .model-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 6px; margin-bottom: 5px; cursor: pointer;
      font-size: 13px; transition: all .12s;
    }
    .model-item:hover { border-color: var(--accent); }
    .model-item.selected { border-color: var(--accent); background: #eaf6eb; }
    .model-item .name { font-weight: 600; }
    .model-item .badge {
      margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 10px;
      background: #e0e0e0; color: #555;
    }
    .model-item .badge.rnn { background: #d6e9ff; color: #1565c0; }
    .model-item .badge.off { background: #f0f0f0; color: #bbb; }
    .crop-coords { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .crop-coords.show { display: grid; }
    .crop-coords label { font-size: 12px; margin-bottom: 3px; }
    .btn {
      width: 100%; padding: 9px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
      margin-top: 4px;
    }
    .btn.run { background: var(--accent); }
    .btn.run:hover { background: var(--accent-dark); }
    .btn.stop { background: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .info { font-size: 12px; color: var(--muted); margin-top: 8px; white-space: pre-line; }
    .progress-wrap { margin-top: 10px; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; display: none; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width .15s; }
    .status-line { margin-top: 10px; font-size: 13px; color: var(--text); }
    /* Three preview panels stacked vertically, together filling the main
       column's full height (each takes an equal third). */
    .previews {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .preview-col {
      flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px;
    }
    .preview-col h3 { margin: 0 0 5px; text-align: center; font-size: 13px; flex-shrink: 0; }
    .preview-col .frame {
      flex: 1; min-height: 0; width: 100%;
      background: #fafafa;
      border: 1px dashed #ccc; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #aaa; font-size: 13px; overflow: hidden;
    }
    .preview-col img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    .radio-row { display: flex; gap: 14px; }
    .radio-row label { display: flex; align-items: center; gap: 5px; margin: 0; }
    /* Batch (folder) thumbnail strip below the previews. */
    .results-strip {
      display: none; flex-shrink: 0; height: 92px; gap: 6px;
      overflow-x: auto; overflow-y: hidden; padding: 4px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    }
    .results-strip.show { display: flex; }
    .thumb {
      flex: 0 0 auto; height: 100%; border: 2px solid transparent;
      border-radius: 4px; cursor: pointer; position: relative; overflow: hidden;
    }
    .thumb.selected { border-color: var(--accent); }
    .thumb img { height: 100%; display: block; }
    .thumb .cap {
      position: absolute; bottom: 0; left: 0; right: 0;
      font-size: 9px; color: #fff; background: rgba(0,0,0,.55);
      padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thumb.err { border-color: var(--danger); }
    /* Server folder browser */
    .browser { margin-top: 8px; border: 1px solid var(--border); border-radius: 6px;
      max-height: 220px; overflow-y: auto; background: #fff; font-size: 13px; }
    .br-head { display: flex; gap: 6px; align-items: center; padding: 6px 8px;
      border-bottom: 1px solid var(--border); background: #f7f9fb; position: sticky; top: 0; }
    .br-path { flex: 1; font-family: monospace; font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
    .br-use { flex-shrink: 0; padding: 4px 8px; font-size: 12px; border: none; border-radius: 5px;
      background: var(--accent); color: #fff; cursor: pointer; }
    .br-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer; }
    .br-item:hover { background: #eef6ef; }
    .br-item .br-cnt { margin-left: auto; font-size: 11px; color: var(--muted); }
    .br-item .br-pick { flex-shrink: 0; font-size: 11px; color: var(--accent); padding: 0 4px; }
    @media (max-width: 1100px) {
      /* Narrow screens: stack sidebar above the previews and let the page
         scroll normally instead of forcing everything into one viewport. */
      body { height: auto; overflow: auto; }
      .layout { flex-direction: column; overflow: visible; }
      .sidebar { width: 100%; overflow-y: visible; }
      .preview-col { min-height: 60vh; }
    }
  </style>
</head>
<body>
  <header>
    <span>🚆 TEP-Net Train Ego-Path Detection</span>
    <span class="status" id="deviceStatus">…</span>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="card span2">
        <h2>Input</h2>
        <label>Image or video file</label>
        <input type="file" id="fileInput" accept="image/*,video/*,.mov,.mkv,.webm,.m4v,.heic" />
        <label style="margin-top:8px;">Or a folder of images (batch upload)</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple />
        <label style="margin-top:8px;">Or a server folder (no upload — fastest)</label>
        <div class="grid2">
          <input type="text" id="serverFolder" placeholder="pick or type a path" />
          <button class="btn" id="browseBtn" style="margin-top:0;background:#455a64;">Browse server…</button>
        </div>
        <div class="browser" id="browser" style="display:none;"></div>
        <div class="grid2" style="margin-top:6px;">
          <select id="optWidth" title="Optimize: resize big images to this width">
            <option value="1280">optimize → 1280px</option>
            <option value="1920" selected>optimize → 1920px</option>
            <option value="2560">optimize → 2560px</option>
          </select>
          <button class="btn" id="optimizeBtn" style="margin-top:0;background:#6a1b9a;">Optimize → JPEG</button>
        </div>
        <div class="info" id="fileInfo">No file selected — the bundled sample image will be used.</div>
      </div>

      <div class="card span2">
        <h2>Upload to server (no SSH)</h2>
        <div class="grid2">
          <div>
            <label>Destination subfolder</label>
            <input type="text" id="uplSubdir" placeholder="myimages" />
          </div>
          <div>
            <label>Folder to upload</label>
            <input type="file" id="uplFiles" webkitdirectory directory multiple />
          </div>
        </div>
        <button class="btn" id="uploadBtn" style="margin-top:8px;background:#1565c0;">Upload to server</button>
      </div>

      <div class="card span2">
        <h2>Model</h2>
        <div class="model-list" id="modelList">Loading…</div>
      </div>

      <div class="card">
        <h2>Device</h2>
        <select id="deviceSelect"></select>
      </div>

      <div class="card">
        <h2>Crop</h2>
        <select id="cropMode">
          <option value="none">None</option>
          <option value="auto">Auto</option>
          <option value="manual">Manual</option>
        </select>
        <div class="crop-coords" id="cropCoords">
          <div><label>Left (x)</label><input type="number" id="cropLeft" value="0" min="0" /></div>
          <div><label>Top (y)</label><input type="number" id="cropTop" value="0" min="0" /></div>
          <div><label>Right (x)</label><input type="number" id="cropRight" value="1369" min="0" /></div>
          <div><label>Bottom (y)</label><input type="number" id="cropBottom" value="1079" min="0" /></div>
        </div>
      </div>

      <div class="card span2">
        <h2>Video options</h2>
        <div class="grid2">
          <div>
            <label>Frame stride (every N-th)</label>
            <input type="number" id="stride" value="1" min="1" />
          </div>
          <div>
            <label>Processing resolution</label>
            <select id="procWidth">
              <option value="854">480p — fastest</option>
              <option value="1280" selected>720p — balanced</option>
              <option value="1920">1080p</option>
              <option value="0">Original — slowest</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn run" id="runBtn">Run Inference</button>
      <button class="btn stop" id="stopBtn" disabled>Stop</button>
      <div class="progress-wrap span2" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="status-line span2" id="statusLine">Ready</div>
    </aside>

    <main class="main">
      <div class="previews">
        <div class="preview-col">
          <h3>원본 (Original)</h3>
          <div class="frame" id="origFrame">Input preview</div>
        </div>
        <div class="preview-col">
          <h3>단일 프레임 (Single-frame)</h3>
          <div class="frame" id="singleFrame">Result preview</div>
        </div>
        <div class="preview-col">
          <h3>RNN (Temporal)</h3>
          <div class="frame" id="rnnFrame">Result preview</div>
        </div>
      </div>
      <div class="results-strip" id="resultsStrip"></div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let selectedModel = null;
    let videoController = null;
    let uploadTick = null;
    let batchFiles = [];      // image files picked from a folder
    let batchResults = [];    // {name, data} stored so thumbnails are clickable
    let batchAbort = false;
    const IMG_RE = /\.(jpe?g|png|bmp|tiff?|heic|heif|webp)$/i;

    // Identity of a selected file. The server caches uploads under this key, so
    // re-running the same file (even after a server restart or browser reload)
    // reuses the server-side copy instead of re-uploading the whole video.
    function fileKey(f) {
      return f ? `${f.name}:${f.size}:${f.lastModified}` : null;
    }

    function setFrame(el, src, placeholder) {
      if (src) {
        el.innerHTML = "";
        const img = new Image();
        img.src = src;
        el.appendChild(img);
      } else {
        el.textContent = placeholder;
      }
    }

    async function loadInfo() {
      const res = await fetch("/api/info");
      const data = await res.json();
      $("deviceStatus").textContent = data.device_status;

      const dev = $("deviceSelect");
      dev.innerHTML = "";
      data.devices.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d;
        if (d === data.default_device) opt.selected = true;
        dev.appendChild(opt);
      });

      const list = $("modelList");
      list.innerHTML = "";
      if (!data.models.length) {
        list.textContent = "No models found";
        return;
      }
      data.models.forEach((m, i) => {
        const item = document.createElement("div");
        item.className = "model-item";
        const info = m.base_info || m.rnn_info || {};
        item.innerHTML =
          `<span class="name">${m.name}</span>` +
          `<span style="color:var(--muted);font-size:11px;">${info.method || ""}/${info.backbone || ""}</span>` +
          `<span class="badge ${m.rnn_path ? "rnn" : "off"}">RNN</span>`;
        item.onclick = () => {
          selectedModel = m.name;
          document.querySelectorAll(".model-item").forEach((e) => e.classList.remove("selected"));
          item.classList.add("selected");
        };
        list.appendChild(item);
        if (i === 0) item.click();
      });
    }

    function resetFrames() {
      setFrame($("origFrame"), null, "Input preview");
      setFrame($("singleFrame"), null, "Result preview");
      setFrame($("rnnFrame"), null, "Result preview");
    }

    $("fileInput").onchange = () => {
      const f = $("fileInput").files[0];
      if (f) { batchFiles = []; $("folderInput").value = ""; }  // single file overrides folder
      $("fileInfo").textContent = f ? f.name : "No file selected — the bundled sample image will be used.";
      // On selecting a new file, clear all panels and show the chosen input
      // image in the Original panel right away (before inference runs).
      resetFrames();
      $("statusLine").textContent = "Ready";
      if (f && /\.(mp4|avi|mov|mkv|webm|m4v)$/i.test(f.name)) {
        $("origFrame").textContent = "Video selected — press Run Inference";
      } else if (f) {
        setFrame($("origFrame"), URL.createObjectURL(f), "Input preview");
      }
    };

    $("folderInput").onchange = () => {
      batchFiles = Array.from($("folderInput").files)
        .filter((f) => IMG_RE.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name));
      if (batchFiles.length) { $("fileInput").value = ""; }  // folder overrides single
      resetFrames();
      $("resultsStrip").innerHTML = "";
      $("resultsStrip").classList.remove("show");
      batchResults = [];
      $("fileInfo").textContent = batchFiles.length
        ? `${batchFiles.length} images selected (batch)`
        : "No image files found in that folder.";
      $("statusLine").textContent = batchFiles.length
        ? `Ready — ${batchFiles.length} images. Press Run Inference.`
        : "Ready";
    };

    // Validate a server folder path and show its image count.
    $("serverFolder").onchange = async () => {
      const path = $("serverFolder").value.trim();
      if (!path) { $("statusLine").textContent = "Ready"; return; }
      $("fileInput").value = ""; $("folderInput").value = ""; batchFiles = [];
      try {
        const r = await fetch(`/api/list_server_folder?path=${encodeURIComponent(path)}`);
        const d = await r.json();
        if (!r.ok || !d.ok) throw new Error(d.error || "not found");
        $("fileInfo").textContent = `Server folder: ${d.count} images (no upload)`;
        $("statusLine").textContent = d.count
          ? `Ready — ${d.count} images on server. Press Run Inference.`
          : "Folder has no images.";
      } catch (e) {
        $("fileInfo").textContent = "Server folder error: " + e.message;
        $("statusLine").textContent = "Error: " + e.message;
      }
    };

    // Server folder browser — navigate folders and pick one (no typing needed).
    function pickServerFolder(path) {
      $("serverFolder").value = path;
      $("browser").style.display = "none";
      $("serverFolder").onchange();
    }
    async function openBrowse(path) {
      try {
        const r = await fetch(`/api/browse?path=${encodeURIComponent(path || "")}`);
        const d = await r.json();
        if (!r.ok || !d.ok) throw new Error(d.error || "browse failed");
        const b = $("browser");
        b.style.display = "block";
        b.innerHTML = "";
        const head = document.createElement("div");
        head.className = "br-head";
        const p = document.createElement("span");
        p.className = "br-path"; p.textContent = d.path; p.title = d.path;
        const use = document.createElement("button");
        use.className = "br-use"; use.textContent = `Use this (${d.images})`;
        use.onclick = () => pickServerFolder(d.path);
        head.appendChild(p); head.appendChild(use); b.appendChild(head);
        if (d.parent) {
          const up = document.createElement("div");
          up.className = "br-item"; up.innerHTML = "<span>⬆ .. (up)</span>";
          up.onclick = () => openBrowse(d.parent); b.appendChild(up);
        }
        if (!d.dirs.length) {
          const e = document.createElement("div");
          e.className = "br-item"; e.style.color = "var(--muted)";
          e.textContent = "(no subfolders)"; b.appendChild(e);
        }
        d.dirs.forEach((dir) => {
          const it = document.createElement("div");
          it.className = "br-item";
          it.innerHTML = `<span>📁 ${dir.name}</span><span class="br-cnt">${dir.images} imgs</span>`;
          it.onclick = () => openBrowse(dir.path);
          if (dir.images > 0) {
            const pick = document.createElement("span");
            pick.className = "br-pick"; pick.textContent = "✓ use";
            pick.onclick = (ev) => { ev.stopPropagation(); pickServerFolder(dir.path); };
            it.appendChild(pick);
          }
          b.appendChild(it);
        });
      } catch (e) {
        $("statusLine").textContent = "Browse error: " + e.message;
      }
    }
    $("browseBtn").onclick = () => {
      if ($("browser").style.display === "block") { $("browser").style.display = "none"; return; }
      openBrowse($("serverFolder").value.trim() || "");
    };

    $("cropMode").onchange = () => {
      $("cropCoords").classList.toggle("show", $("cropMode").value === "manual");
    };

    function buildForm(fileOverride) {
      const fd = new FormData();
      fd.append("model", selectedModel);
      fd.append("device", $("deviceSelect").value);
      fd.append("crop_mode", $("cropMode").value);
      if ($("cropMode").value === "manual") {
        fd.append("crop_left", $("cropLeft").value);
        fd.append("crop_top", $("cropTop").value);
        fd.append("crop_right", $("cropRight").value);
        fd.append("crop_bottom", $("cropBottom").value);
      }
      const f = fileOverride !== undefined ? fileOverride : $("fileInput").files[0];
      if (f) fd.append("file", f);
      return fd;
    }

    function showImageResult(data) {
      setFrame($("origFrame"), data.original, "Input preview");
      setFrame($("singleFrame"), data.single,
        data.single_is_fallback ? "Single-frame (RNN base net)" : "Result preview");
      setFrame($("rnnFrame"), data.rnn, data.has_rnn ? "Result preview" : "No RNN model");
    }

    function setBusy(busy) {
      $("runBtn").disabled = busy;
      $("stopBtn").disabled = !busy;
      $("progressWrap").style.display = busy ? "block" : "none";
      if (!busy) $("progressBar").style.width = "0%";
    }

    async function runImage() {
      setBusy(true);
      $("statusLine").textContent = "Running inference…";
      try {
        const res = await fetch("/api/infer_image", { method: "POST", body: buildForm() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Inference failed");
        showImageResult(data);
        $("statusLine").textContent = "Inference complete!";
      } catch (e) {
        $("statusLine").textContent = "Error: " + e.message;
      } finally {
        setBusy(false);
      }
    }

    function addThumb(name, data, ok) {
      const idx = batchResults.length;
      batchResults.push({ name, data, ok });
      const t = document.createElement("div");
      t.className = "thumb" + (ok ? "" : " err");
      t.title = name + (ok ? "" : " — " + (data.error || "failed"));
      if (ok && data.single) {
        const im = new Image(); im.src = data.single; t.appendChild(im);
      } else {
        t.style.width = "70px"; t.style.background = "#fbe9e7";
      }
      const cap = document.createElement("div");
      cap.className = "cap"; cap.textContent = name;
      t.appendChild(cap);
      t.onclick = () => {
        document.querySelectorAll(".thumb").forEach((e) => e.classList.remove("selected"));
        t.classList.add("selected");
        const r = batchResults[idx];
        if (r.ok) { showImageResult(r.data); $("statusLine").textContent = `Showing ${r.name}`; }
        else { $("statusLine").textContent = `${r.name}: ${r.data.error || "failed"}`; }
      };
      $("resultsStrip").appendChild(t);
    }

    // Process a folder of images sequentially, updating the panels live and
    // building a clickable thumbnail strip.
    async function runBatch() {
      setBusy(true);
      batchAbort = false;
      batchResults = [];
      $("resultsStrip").innerHTML = "";
      $("resultsStrip").classList.add("show");
      const total = batchFiles.length;
      let okCount = 0;
      for (let i = 0; i < total; i++) {
        if (batchAbort) { $("statusLine").textContent = `Stopped at ${i}/${total}`; break; }
        const f = batchFiles[i];
        $("statusLine").textContent = `Processing ${i + 1}/${total}: ${f.name}`;
        $("progressBar").style.width = Math.round(((i + 1) / total) * 100) + "%";
        try {
          const res = await fetch("/api/infer_image", { method: "POST", body: buildForm(f) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "failed");
          showImageResult(data);
          addThumb(f.name, data, true);
          okCount++;
        } catch (e) {
          addThumb(f.name, { error: e.message }, false);
        }
      }
      if (!batchAbort) {
        $("statusLine").textContent = `Done — ${okCount}/${total} images processed`;
      }
      setBusy(false);
    }

    // Process every image in a server-side folder — no upload. Streams results
    // via SSE and reuses the live panels + thumbnail strip.
    async function runServerFolder(path) {
      setBusy(true);
      batchAbort = false;
      batchResults = [];
      $("resultsStrip").innerHTML = "";
      $("resultsStrip").classList.add("show");
      $("statusLine").textContent = "Starting server folder…";
      videoController = new AbortController();
      const fd = buildForm(null);          // no file
      fd.append("folder", path);
      fd.append("proc_width", $("procWidth").value);
      try {
        const res = await fetch("/api/infer_folder", { method: "POST", body: fd, signal: videoController.signal });
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try { detail = (await res.json()).error || detail; } catch (_) {}
          $("statusLine").textContent = "Error: " + detail; setBusy(false); return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "", lastIndex = 0;
        while (true) {
          if (batchAbort) { videoController.abort(); break; }
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n\n", lastIndex)) >= 0) {
            const chunk = buffer.slice(lastIndex, idx).trim();
            lastIndex = idx + 2;
            if (!chunk.startsWith("data:")) continue;
            let m; try { m = JSON.parse(chunk.slice(5).trim()); } catch (_) { continue; }
            if (m.type === "status") {
              $("statusLine").textContent = m.message;
            } else if (m.type === "image") {
              showImageResult(m);
              addThumb(m.name, m, true);
              $("progressBar").style.width = Math.round(((m.index + 1) / m.total) * 100) + "%";
              $("statusLine").textContent = `Processing ${m.index + 1}/${m.total}: ${m.name} · ${m.elapsed}s`;
            } else if (m.type === "image_error") {
              addThumb(m.name, { error: m.error }, false);
            } else if (m.type === "done") {
              $("statusLine").textContent = `Done — ${m.count}/${m.total} images in ${m.elapsed}s (no upload)`;
            } else if (m.type === "error") {
              $("statusLine").textContent = "Error: " + m.error;
            }
          }
          buffer = buffer.slice(lastIndex); lastIndex = 0;
        }
      } catch (e) {
        if (e.name !== "AbortError") $("statusLine").textContent = "Error: " + e.message;
      } finally {
        setBusy(false);
      }
    }

    function stopUploadTick() {
      if (uploadTick) { clearInterval(uploadTick); uploadTick = null; }
    }

    // Uses XMLHttpRequest (not fetch) so the upload phase can report real
    // progress via upload.onprogress, while the streamed SSE response is parsed
    // incrementally from xhr.responseText.
    async function runVideo() {
      setBusy(true);
      const f = $("fileInput").files[0];
      const key = fileKey(f);
      const sizeMb = f ? (f.size / (1024 * 1024)).toFixed(1) : "?";

      // Ask the server whether it already holds this file (survives restarts &
      // reloads). If so, skip uploading and just reference it by key.
      $("statusLine").textContent = "Checking server cache…";
      let reuse = false;
      if (key) {
        try {
          const r = await fetch(`/api/video_cached?key=${encodeURIComponent(key)}`);
          reuse = r.ok && (await r.json()).cached;
        } catch (_) {}
      }

      const fd = buildForm();
      fd.append("video_key", key || "");
      fd.append("proc_width", $("procWidth").value);
      if (reuse) fd.delete("file");

      $("statusLine").textContent = reuse
        ? "Re-running cached video (no upload needed)…"
        : `Uploading 0% of ${sizeMb} MB…`;
      $("progressBar").style.width = "0%";

      const xhr = new XMLHttpRequest();
      videoController = xhr;           // stopBtn calls .abort()
      let lastIndex = 0;
      let sawTerminal = false;
      let processing = false;          // switched true once frames start

      function handle(msg) {
        if (msg.type === "status") {
          stopUploadTick();
          processing = true;
          $("progressBar").style.width = "0%";
          $("statusLine").textContent = msg.message;
        } else if (msg.type === "frame") {
          stopUploadTick();
          processing = true;
          setFrame($("origFrame"), msg.original, "Input preview");
          setFrame($("singleFrame"), msg.single, "Result preview");
          setFrame($("rnnFrame"), msg.rnn, "Result preview");
          const pct = msg.total ? Math.round(((msg.frame + 1) / msg.total) * 100) : null;
          $("progressBar").style.width = (pct === null ? 0 : pct) + "%";
          const fps = msg.elapsed > 0 ? (msg.emitted / msg.elapsed) : 0;
          const where = msg.total
            ? `frame ${msg.frame + 1}/${msg.total} (${pct}%)`
            : `frame ${msg.frame + 1}`;
          $("statusLine").textContent =
            `Processing ${where} · ${fps.toFixed(1)} fps · ${msg.elapsed}s`;
        } else if (msg.type === "done") {
          sawTerminal = true;
          const fps = msg.elapsed > 0 ? (msg.frames / msg.elapsed) : 0;
          $("statusLine").textContent =
            `Done — ${msg.frames} frames in ${msg.elapsed}s (${fps.toFixed(1)} fps)`;
        } else if (msg.type === "error") {
          sawTerminal = true;
          $("statusLine").textContent = "Error: " + msg.error;
        }
      }

      function drain() {
        const text = xhr.responseText;
        let idx;
        while ((idx = text.indexOf("\n\n", lastIndex)) >= 0) {
          const chunk = text.slice(lastIndex, idx).trim();
          lastIndex = idx + 2;
          if (chunk.startsWith("data:")) {
            try { handle(JSON.parse(chunk.slice(5).trim())); } catch (_) {}
          }
        }
      }

      // Upload phase: real byte progress.
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && !processing) {
          const pct = Math.round((e.loaded / e.total) * 100);
          $("progressBar").style.width = pct + "%";
          $("statusLine").textContent =
            `Uploading ${pct}% (${(e.loaded / 1048576).toFixed(1)}/${(e.total / 1048576).toFixed(1)} MB)`;
        }
      };
      xhr.upload.onload = () => {
        if (!processing) {
          // Upload done; server is preparing. Tick elapsed until first event.
          $("progressBar").style.width = "100%";
          const t1 = performance.now();
          stopUploadTick();
          uploadTick = setInterval(() => {
            if (!processing) {
              const s = ((performance.now() - t1) / 1000).toFixed(0);
              $("statusLine").textContent = `Upload complete · preparing model… (${s}s)`;
            }
          }, 500);
        }
      };

      // Response phase: parse SSE as it streams in.
      xhr.onprogress = drain;
      xhr.onload = () => {
        stopUploadTick();
        drain();
        if (xhr.status >= 400) {
          let detail = `HTTP ${xhr.status}`;
          try { detail = JSON.parse(xhr.responseText).error || detail; } catch (_) {}
          // Cache miss on a reuse attempt — next run's pre-check will re-upload.
          if (reuse) detail += " (press Run again to re-upload)";
          $("statusLine").textContent = "Error: " + detail;
        } else if (!sawTerminal) {
          $("statusLine").textContent = "Stopped — stream ended unexpectedly";
        }
        setBusy(false);
      };
      xhr.onerror = () => {
        stopUploadTick();
        $("statusLine").textContent = "Error: network error during upload";
        setBusy(false);
      };
      xhr.onabort = () => { stopUploadTick(); setBusy(false); };

      xhr.open("POST", "/api/infer_video");
      xhr.send(fd);
    }

    $("runBtn").onclick = () => {
      if (!selectedModel) { $("statusLine").textContent = "Please select a model"; return; }
      const serverPath = $("serverFolder").value.trim();
      if (serverPath) { runServerFolder(serverPath); return; }
      if (batchFiles.length) { runBatch(); return; }
      const f = $("fileInput").files[0];
      const isVideo = f && /\.(mp4|avi|mov|mkv|webm|m4v)$/i.test(f.name);
      if (isVideo) runVideo(); else runImage();
    };

    $("stopBtn").onclick = () => {
      batchAbort = true;
      if (videoController) videoController.abort();
      stopUploadTick();
      setBusy(false);
      $("statusLine").textContent = "Stopped";
    };

    // Upload a folder of files to a server subfolder (works over the Funnel URL,
    // no SSH). On success, auto-fill the server folder path for inference.
    $("uploadBtn").onclick = () => {
      const sub = $("uplSubdir").value.trim();
      const files = Array.from($("uplFiles").files);
      if (!sub) { $("statusLine").textContent = "Enter a destination subfolder"; return; }
      if (!files.length) { $("statusLine").textContent = "Select a folder to upload"; return; }
      $("uploadBtn").disabled = true;
      setBusy(true);
      $("statusLine").textContent = `Uploading ${files.length} files…`;
      const fd = new FormData();
      fd.append("subdir", sub);
      files.forEach((f) => fd.append("files", f, f.name));
      const xhr = new XMLHttpRequest();
      videoController = xhr;
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          $("progressBar").style.width = pct + "%";
          $("statusLine").textContent =
            `Uploading ${pct}% (${(e.loaded / 1048576).toFixed(1)}/${(e.total / 1048576).toFixed(1)} MB)`;
        }
      };
      xhr.onload = () => {
        $("uploadBtn").disabled = false;
        setBusy(false);
        if (xhr.status >= 400) {
          let detail = `HTTP ${xhr.status}`;
          try { detail = JSON.parse(xhr.responseText).error || detail; } catch (_) {}
          $("statusLine").textContent = "Upload error: " + detail;
          return;
        }
        let d = {}; try { d = JSON.parse(xhr.responseText); } catch (_) {}
        $("statusLine").textContent =
          `Uploaded ${d.saved} files to ${d.path}` + (d.skipped ? ` (${d.skipped} skipped)` : "");
        if (d.path) { $("serverFolder").value = d.path; $("serverFolder").onchange(); }
      };
      xhr.onerror = () => {
        $("uploadBtn").disabled = false; setBusy(false);
        $("statusLine").textContent = "Upload error: network error";
      };
      xhr.open("POST", "/api/upload_to_server");
      xhr.send(fd);
    };

    // Convert a server folder of big images to resized JPEGs (one-time), then
    // point inference at the faster '_opt' folder.
    async function runOptimize(path) {
      setBusy(true);
      batchAbort = false;
      $("statusLine").textContent = "Optimizing folder…";
      videoController = new AbortController();
      const fd = new FormData();
      fd.append("folder", path);
      fd.append("max_width", $("optWidth").value);
      try {
        const res = await fetch("/api/optimize_folder", { method: "POST", body: fd, signal: videoController.signal });
        if (!res.ok) {
          let detail = `HTTP ${res.status}`;
          try { detail = (await res.json()).error || detail; } catch (_) {}
          $("statusLine").textContent = "Optimize error: " + detail; setBusy(false); return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "", lastIndex = 0;
        while (true) {
          if (batchAbort) { videoController.abort(); break; }
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n\n", lastIndex)) >= 0) {
            const chunk = buffer.slice(lastIndex, idx).trim();
            lastIndex = idx + 2;
            if (!chunk.startsWith("data:")) continue;
            let m; try { m = JSON.parse(chunk.slice(5).trim()); } catch (_) { continue; }
            if (m.type === "status") {
              $("statusLine").textContent = m.message;
            } else if (m.type === "progress") {
              $("progressBar").style.width = Math.round(((m.index + 1) / m.total) * 100) + "%";
              $("statusLine").textContent = `Optimizing ${m.index + 1}/${m.total}: ${m.name} · ${m.elapsed}s`;
            } else if (m.type === "done") {
              $("statusLine").textContent = `Optimized ${m.count}/${m.total} → ${m.dest} (${m.elapsed}s). Ready to run.`;
              if (m.dest) { $("serverFolder").value = m.dest; $("serverFolder").onchange(); }
            } else if (m.type === "error") {
              $("statusLine").textContent = "Error: " + m.error;
            }
          }
          buffer = buffer.slice(lastIndex); lastIndex = 0;
        }
      } catch (e) {
        if (e.name !== "AbortError") $("statusLine").textContent = "Error: " + e.message;
      } finally {
        setBusy(false);
      }
    }
    $("optimizeBtn").onclick = () => {
      const path = $("serverFolder").value.trim();
      if (!path) { $("statusLine").textContent = "Pick/enter a server folder to optimize"; return; }
      runOptimize(path);
    };

    loadInfo();
  </script>
</body>
</html>
