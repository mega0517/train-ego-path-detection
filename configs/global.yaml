# backbone configuration
pretrained: True  # whether to use pretrained weights for the backbone
input_shape: [3, 512, 512]  # input size of the model (channels, height, width)

# training configuration
optimizer: adam  # optimizer name (only "adam" is supported)
scheduler: one_cycle  # scheduler name (only "one_cycle" is supported, "null" for no scheduler)
train_prop: 0.8  # proportion of the dataset to use for training
val_prop: 0.1  # proportion of the dataset to use for validation
test_prop: 0.1  # proportion of the dataset to use for testing
workers: 8  # 2 runs share this 24-core host; 16 each would oversubscribe
gpu_preprocess: false  # move JPEG decode/crop/resize/jitter/flip to the GPU (temporal training); dataloader workers only read raw bytes
seed: 42  # random seed for reproducibility
val_iterations: 1  # number of epochs of the validation set to validate the model
test_iterations: 10  # number of epochs of the test set to test the model

# dataset augmentation configuration
brightness: 0.5  # brightness factor
contrast: 0.5  # contrast factor
saturation: 0.5  # saturation factor
hue: 0.2  # hue factor
crop_margin_sides: 0.1  # crop margin for the left-right crop augmentation (red rectangle in paper fig. 4)
crop_margin_top: 0.1  # crop margin for the top crop augmentation (red rectangle in paper fig. 4)
std_dev_factor_sides: 0.3  # standard deviation factor for the left-right crop augmentation
std_dev_factor_top: 0.1  # standard deviation factor for the top crop augmentation

# temporal (RNN) configuration — only used by the "+RNN" temporal models (train.py --temporal)
seq_len: 5  # number of consecutive frames kept in memory for tracking
rnn_hidden: 256  # hidden size of the temporal GRU (regression/classification)
rnn_layers: 1  # number of stacked GRU layers
seg_rnn_hidden: 8  # hidden channels of the ConvGRU (segmentation)
seq_jitter: 0.05  # crop-box jitter factor for pseudo-sequence synthesis
seq_occlusion_prob: 0.0  # probability of masking the bottom band of the last frame's input (target kept) — turnout-occlusion augmentation; set via train.py --seq-occlusion
seq_occlusion_min: 0.1  # minimum occluded fraction of the image height (from the bottom)
seq_occlusion_max: 0.4  # maximum occluded fraction of the image height (from the bottom)

# prior-path channel configuration — only used by --prior-channel runs.
# The mixture below is what the 4th channel is trained to mean; see
# PathsDataset.generate_prior for why each regime is there.
prior_empty_prob: 0.15  # fraction of samples given an empty prior (sequence start / lost track)
prior_wrong_prob: 0.15  # fraction given a badly displaced prior (committed to the wrong branch)
prior_wrong_shift: [0.06, 0.25]  # displacement range of a wrong prior, as a fraction of width
prior_jitter: 0.02  # std-dev of the shift applied to a correct prior (~one frame of ego-motion)
prior_occlusion_prob: 0.35  # probability of blanking the bottom band of the RGB (switch-passage geometry)
prior_occlusion_min: 0.1  # minimum blanked fraction of image height, from the bottom
prior_occlusion_max: 0.45  # maximum blanked fraction

# paths configuration
images_path: "/data3/bhkim/datasets/OSDaR23_rgb_center"  # path to the images directory
annotations_path: "/data3/bhkim/datasets/OSDaR23_rgb_center/egopath_labels.json"  # path to the annotations file